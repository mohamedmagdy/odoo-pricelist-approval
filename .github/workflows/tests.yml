name: tests

on:
  push:
  pull_request:

jobs:
  odoo:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install the module and run its tests on Odoo 18
        run: |
          docker run --rm --network host \
            -v "$PWD":/mnt/extra-addons:ro \
            -e HOST=localhost -e USER=odoo -e PASSWORD=odoo \
            odoo:18.0 \
            odoo \
              -d test_db -i pricelist_approval \
              --test-tags /pricelist_approval \
              --stop-after-init --no-http --without-demo=all
